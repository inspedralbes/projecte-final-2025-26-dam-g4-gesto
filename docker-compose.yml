services:
  backend:
    restart: always
    build: ./backend
    volumes:
      - ./backend:/usr/src/app
      - ./gesto:/usr/src/gesto
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama

  frontend:
    restart: always
    build: ./gesto
    volumes:
      - ./gesto:/app
      - /app/node_modules
    depends_on:
      - backend

  proxy:
    image: nginx:stable
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
