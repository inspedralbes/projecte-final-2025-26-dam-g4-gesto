name: Integració Contínua (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gesto/package-lock.json

      - name: Instal·lar dependències
        working-directory: gesto
        run: npm install

      - name: Executar Linter
        working-directory: gesto
        run: npm run lint

      - name: Construir projecte (Build)
        working-directory: gesto
        run: npm run build

  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instal·lar dependències
        working-directory: backend
        run: npm install

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Build Frontend Image
        working-directory: gesto
        run: docker build . -t gesto-app:test

      - name: Build Backend Image
        working-directory: backend
        run: docker build . -t gesto-backend:test

  deploy:
    name: Desplegament Automàtic (CD)
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Connectar per SSH i actualitzar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            docker-compose up -d --build
